[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo

; DB-Verbindung wird via Umgebungsvariablen HOST/USER/PASSWORD/PORT
; aus Azure Container Apps gesetzt – hier keine Hardcoded-Werte.

; Hinter Azure Container Apps Ingress: HTTPS-Header respektieren
proxy_mode = True

; DB-Listing in der Login-Maske sperren (Sicherheit)
list_db = False
dbfilter = ^odoo$

; Worker-Konfiguration (für Container Apps: 2 vCPU empfohlen in Dev)
workers = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_hard = 1342177280
limit_memory_soft = 1073741824

log_level = info
