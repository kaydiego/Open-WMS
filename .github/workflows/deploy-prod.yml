name: Deploy Prod

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image-Tag aus ACR, der nach Prod soll (Default: dev-latest)'
        required: true
        default: 'dev-latest'

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: fastlog-wms
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AZURE_RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_APP_PROD: ${{ secrets.AZURE_CONTAINERAPP_PROD }}

jobs:
  promote:
    name: Promote to Prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Verify image exists in ACR
        run: |
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            --query "[?@=='${{ inputs.image_tag }}']" -o tsv \
            | grep -q . || { echo "Tag ${{ inputs.image_tag }} nicht in ACR gefunden"; exit 1; }

      - name: Tag as prod-latest in ACR
        run: |
          ACR_NAME="${ACR_LOGIN_SERVER%%.*}"
          az acr import \
            --name "$ACR_NAME" \
            --source "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ inputs.image_tag }}" \
            --image "$IMAGE_NAME:prod-latest" \
            --force

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$AZURE_APP_PROD" \
            --resource-group "$AZURE_RG" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ inputs.image_tag }}"

      - name: Summary
        run: |
          echo "### Prod deployed :tada:" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ inputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Auch getaggt als: \`prod-latest\`" >> "$GITHUB_STEP_SUMMARY"
