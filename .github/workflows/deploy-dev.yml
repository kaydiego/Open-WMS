name: Deploy Dev

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: fastlog-wms
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AZURE_RG: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_APP_DEV: ${{ secrets.AZURE_CONTAINERAPP_DEV }}

jobs:
  test:
    name: Odoo-Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile.prod -t ${{ env.IMAGE_NAME }}:ci .

      - name: Run Odoo tests
        run: |
          docker run --rm --network host \
            ${{ env.IMAGE_NAME }}:ci \
            -d test_db \
            --db_host=localhost --db_port=5432 \
            --db_user=odoo --db_password=odoo \
            --test-enable --stop-after-init \
            -i fastlog_wms --without-demo=all \
            --log-level=test

  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Compute image tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Build & push image
        run: |
          IMAGE="$ACR_LOGIN_SERVER/$IMAGE_NAME"
          TAG="${{ steps.meta.outputs.image_tag }}"
          docker build -f docker/Dockerfile.prod \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:dev-latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:dev-latest"

  deploy-dev:
    name: Deploy Dev (Azure Container Apps)
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$AZURE_APP_DEV" \
            --resource-group "$AZURE_RG" \
            --image "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Summary
        run: |
          echo "### Dev deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ needs.build-and-push.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Promotion nach Prod: Actions → **Deploy Prod** → Run workflow (Tag-Default: \`dev-latest\`)" >> "$GITHUB_STEP_SUMMARY"
